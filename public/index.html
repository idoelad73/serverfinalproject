<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אימות הושלם בהצלחה!</title>
    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* סגנון כללי - שימוש בפונט מערכת ובצבעי רקע בהירים */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
            background-color: #eef2f5; /* רקע בהיר זהה לאימייל */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* קונטיינר מרכזי */
        .container {
            background: white;
            border-radius: 12px; /* פינות עגולות מתונות */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* צל עדין יותר */
            max-width: 500px; /* צר מעט יותר */
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        /* אנימציה */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* כותרת - שימוש בצבע הירוק הראשי */
        .header {
            background-color: #10b981; /* ירוק רענן - הצבע הראשי שלנו */
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .success-icon {
            font-size: 70px;
            margin-bottom: 15px;
            display: inline-block;
            color: white; /* אייקון לבן על רקע ירוק */
            animation: bounce 1.2s ease-out; /* הופך את האנימציה לקצת יותר איטית */
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-15px);
            }
            60% {
                transform: translateY(0);
            }
        }

        .header h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        /* תוכן ראשי */
        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .message {
            color: #4b5563; /* גוון אפור כהה-כחול */
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* תכונות/דגשים */
        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .feature {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            background: #f9fafb; /* רקע עדין מאוד */
            border-radius: 8px;
            border: 1px solid #e5e7eb; /* גבול דק */
            transition: all 0.3s ease;
        }

        .feature:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.1);
        }

        .feature-icon {
            font-size: 30px;
            margin-bottom: 5px;
            color: #10b981; /* צבע האייקונים ירוק ראשי */
        }

        .feature-text {
            color: #4b5563;
            font-size: 14px;
            font-weight: 600;
        }

        /* כפתור ראשי */
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background-color: #10b981; /* צבע הכפתור ירוק ראשי */
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background-color: #059669; /* ירוק כהה יותר ברפרוף */
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(16, 185, 129, 0.6);
        }

        /* פוטר */
        .footer {
            padding: 20px;
            background-color: #f3f4f6; /* רקע פוטר מעט כהה יותר מהרקע הכללי */
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer p {
            color: #9ca3af;
            font-size: 12px;
        }

        /* רספונסיביות */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }
            .content {
                padding: 30px 20px;
            }
            .features {
                flex-direction: column;
            }
            .feature {
                min-width: 100%;
            }
            .btn {
                padding: 12px 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header">
            <div class="success-icon">🎉</div>
            <h1>האימות הושלם בהצלחה!</h1>
            <p>כתובת האימייל שלך אומתה בהצלחה</p>
        </div>

        <div class="content">
            <p class="message">
                **ברוך הבא!** החשבון שלך מאומת ומוכן לשימוש מיידי.<br>
                כעת תוכל להתחבר ולגשת לכל התכונות והשירותים שלנו.
            </p>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">✅</div>
                    <div class="feature-text">חשבון מאומת</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔒</div>
                    <div class="feature-text">אבטחה מקסימלית</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">✨</div>
                    <div class="feature-text">התחלה מיידית</div>
                </div>
            </div>

            <a href="http://localhost:5173/login" class="btn">
                🏠 עבור לחשבון שלך
            </a>
        </div>

        <div class="footer">
            <p>תודה שבחרת בנו. © 2025 כל הזכויות שמורות</p>
        </div>
    </div>
</body>
</html>
